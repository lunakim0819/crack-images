<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0D">
<title>RARE 레어 · 대한바텀민국 BDSM편</title>
<style>
/* RARE 스타일: 블랙 + 핫핑크 */
:root{
  --bg:#0B0B0D; --card:#141417; --card2:#1B1B20; --line:#26262D;
  --pink:#FF2E93; --pink2:#FF5FB0; --text:#F5F5F7; --sub:#9A9AA5; --dim:#5E5E68;
  --gold:#F5C46B; --yes:#2BD49A; --maybe:#F5C46B; --no:#FF4D5E;
  --glow:0 0 24px rgba(255,46,147,.35);
  --grad:linear-gradient(135deg,#FF2E93,#FF5FB0);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#050506;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
a{color:inherit;text-decoration:none}
#app{position:relative;max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);overflow:hidden;box-shadow:0 0 60px rgba(255,46,147,.08)}
.screen{min-height:100vh;padding-bottom:84px}
.noTab{padding-bottom:0}

/* 로고 */
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.18em}
.logo svg{filter:drop-shadow(0 0 8px rgba(255,46,147,.6))}
.logo b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:20px}

/* 상단바 */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:rgba(11,11,13,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top h1{font-size:18px;font-weight:700}
.iconBtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:20px}
.ticker{margin:12px 16px 0;padding:9px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker em{color:var(--pink);font-style:normal;font-weight:700;margin-right:6px}

/* 스플래시 */
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;background:radial-gradient(circle at 50% 30%,rgba(255,46,147,.22),transparent 60%),var(--bg)}
.splash .bigLogo{margin-bottom:18px}
.splash h2{font-size:34px;letter-spacing:.3em;font-weight:900;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-left:.3em}
.splash p.tag{color:var(--sub);margin:6px 0 28px}
.statRow{display:flex;gap:8px;width:100%;margin-bottom:26px}
.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 6px}
.stat b{display:block;font-size:18px;color:var(--pink)}
.stat span{font-size:11px;color:var(--sub)}
.ageBox{width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:left}
.ageBox h3{font-size:15px;margin-bottom:6px}
.ageBox p{font-size:12px;color:var(--sub);margin-bottom:12px}
.check{display:flex;align-items:center;gap:12px;padding:14px 4px;font-size:14px;min-height:48px;width:100%;text-align:left}
.check i{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--dim);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none}
.check.on i{background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.btn{display:block;width:100%;padding:16px;border-radius:16px;font-weight:700;font-size:16px;text-align:center;background:var(--grad);color:#fff;box-shadow:var(--glow);margin-top:14px}
.btn.ghost{background:var(--card);box-shadow:none;border:1px solid var(--line)}
.btn[disabled],.btn.off{opacity:.35;pointer-events:none}
.fine{font-size:11px;color:var(--dim);margin-top:14px}

/* 온보딩 */
.ob{padding:24px 20px 40px}
.ob h2{font-size:22px;margin:8px 0 4px}
.ob .sub{color:var(--sub);font-size:13px;margin-bottom:20px}
.sec{margin-bottom:22px}
.secT{font-size:13px;color:var(--sub);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;gap:10px}
.seg button{flex:1;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:700}
.seg button.on{border-color:var(--pink);box-shadow:var(--glow);color:var(--pink2)}
.roleList{display:grid;gap:8px}
.roleItem{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:left;width:100%}
.roleItem b{font-size:15px}.roleItem span{display:block;font-size:12px;color:var(--sub)}
.roleItem.on{border-color:var(--pink);box-shadow:var(--glow)}
.roleItem.on::after{content:"✓";color:var(--pink);font-weight:900}
.txt{width:100%;padding:13px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);outline:none}
.txt:focus{border-color:var(--pink)}
.lock{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:linear-gradient(135deg,#2a1020,#1a0a14);border:1px solid rgba(255,46,147,.5);color:var(--pink2);font-size:12px;font-weight:700}

/* 탐색 카드 */
.deck{position:relative;height:min(470px,calc(100vh - 330px));min-height:380px;margin:14px 16px 0}
.card{position:absolute;inset:0;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:pan-y;user-select:none;transition:transform .2s ease,opacity .2s}
.card.featured{border:1.5px solid var(--gold);box-shadow:0 0 0 1px rgba(245,196,107,.2),0 10px 30px rgba(0,0,0,.6)}
.card.back{transform:scale(.95) translateY(14px);opacity:.6}
.card .ph{position:absolute;inset:0}
.card .shade{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.92))}
.card .info{position:absolute;left:0;right:0;bottom:0;padding:18px}
.card .nm{font-size:26px;font-weight:800}.card .nm small{font-size:18px;font-weight:500;color:#ddd;margin-left:6px}
.card .meta{font-size:12px;color:#ccc;margin:4px 0 8px}
.card .bio{font-size:13px;color:#e8e8ea;margin-top:8px}
.badge{position:absolute;top:14px;left:14px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
.badge.gold{color:var(--gold);border:1px solid var(--gold)}
.badge.ex{color:var(--sub);border:1px solid var(--dim)}
.onl{position:absolute;top:14px;right:14px;font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.55);color:var(--yes)}
.stamp{position:absolute;top:60px;padding:6px 14px;border:3px solid;border-radius:10px;font-size:28px;font-weight:900;opacity:0;transform:rotate(-14deg)}
.stamp.like{left:20px;color:var(--pink);border-color:var(--pink)}
.stamp.nope{right:20px;color:var(--sub);border-color:var(--sub);transform:rotate(14deg)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#eee}
.tag.role{background:var(--grad);border:0;color:#fff;font-weight:700}
.actions{display:flex;justify-content:center;gap:22px;margin:18px 0 6px}
.act{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--card);border:1px solid var(--line)}
.act.like{width:72px;height:72px;background:var(--grad);border:0;box-shadow:var(--glow);font-size:30px}
.act.info{font-size:18px}
.empty{text-align:center;color:var(--sub);padding:120px 20px}

/* 자리표시 이미지 */
.ph{position:relative;display:grid;place-items:center;font-weight:900;color:rgba(255,255,255,.9);background-size:cover;background-position:center}
.ph img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.ph .ini{font-size:64px;text-shadow:0 4px 24px rgba(0,0,0,.4)}
.ph .phNote{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:10px;color:rgba(255,255,255,.4);font-weight:500}
.av{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;position:relative}
.av .ph{position:absolute;inset:0}
.av .ini{font-size:20px}
.av.sm{width:40px;height:40px}.av.sm .ini{font-size:15px}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--pink)}
.av.gold{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--gold)}

/* 게이지 */
.gauges{display:flex;gap:10px}
.gauge{flex:1}
.gauge .gl{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-bottom:4px}
.gauge .gl b{color:var(--text)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .5s}
.bar.heat i{background:linear-gradient(90deg,#7a5cff,#FF2E93)}

/* 상세 */
.hero{position:relative;height:min(460px,58vh)}
.hero .ph{position:absolute;inset:0}
.hero .ini{font-size:100px}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4),transparent 30%,transparent 55%,var(--bg))}
.hero .back{position:absolute;top:14px;left:14px;z-index:2;background:rgba(0,0,0,.55);width:44px;height:44px}
.hero .hInfo{position:absolute;bottom:10px;left:18px;right:18px}
.hero .nm{font-size:30px;font-weight:800}
.box{margin:12px 16px;padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.box h4{font-size:13px;color:var(--pink2);margin-bottom:10px;letter-spacing:.02em}
.box p{font-size:14px;color:#ddd}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv span{color:var(--sub)}
.lim{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.lim .tag.hard{border-color:rgba(255,77,94,.5);color:#ff8a95;background:rgba(255,77,94,.08)}
.lim .tag.soft{border-color:rgba(245,196,107,.5);color:var(--gold);background:rgba(245,196,107,.08)}
.limT{font-size:12px;color:var(--sub);margin-bottom:6px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#2a0f1d,#160a10);border:1px solid rgba(255,46,147,.4)}
.sw b{font-size:18px;color:var(--pink2)}
.cl{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.cl:last-child{border:0}
.chips{display:flex;gap:4px}
.chip{font-size:11px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim);font-weight:700}
.chip.yes.on{background:rgba(43,212,154,.15);border-color:var(--yes);color:var(--yes)}
.chip.maybe.on{background:rgba(245,196,107,.15);border-color:var(--maybe);color:var(--maybe)}
.chip.no.on{background:rgba(255,77,94,.15);border-color:var(--no);color:var(--no)}
.policy{margin:12px 16px;padding:12px 14px;border-radius:14px;font-size:12px;color:#ffc2df;background:rgba(255,46,147,.08);border:1px dashed rgba(255,46,147,.45)}
.stickyAct{position:sticky;bottom:84px;padding:10px 16px;display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 40%)}
.stickyAct .btn{margin:0}

/* 매치 */
.matchGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px}
.mItem{text-align:center;font-size:12px}
.mItem .av{width:100%;height:auto;aspect-ratio:1;border-radius:18px;margin-bottom:6px}
.mItem .av .ini{font-size:30px}
.likesBanner{margin:14px 16px 0;padding:16px;border-radius:18px;background:var(--grad);box-shadow:var(--glow);display:flex;justify-content:space-between;align-items:center}
.likesBanner b{font-size:22px;display:block}
.likesBanner span{font-size:12px;opacity:.9}

/* 채팅 목록 */
.hList{display:flex;gap:14px;overflow-x:auto;padding:14px 16px 6px}
.hList::-webkit-scrollbar{display:none}
.hItem{text-align:center;font-size:11px;color:var(--sub);flex:none;width:60px}
.hItem .av{width:58px;height:58px;margin-bottom:6px}
.cRow{display:flex;gap:12px;align-items:center;padding:16px;width:100%;text-align:left;min-height:76px}
.cRow:active{background:var(--card)}
.cRow .c1{flex:1;min-width:0}
.cRow .c1 b{font-size:15px}
.cRow .c1 p{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cRow .c2{font-size:11px;color:var(--sub);text-align:right}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink);margin-left:6px;box-shadow:var(--glow)}
.label{padding:16px 16px 4px;font-size:12px;color:var(--sub);font-weight:700}

/* 채팅방 */
.room{display:flex;flex-direction:column;height:100vh;padding:0}
.roomTop{padding:10px 14px;border-bottom:1px solid var(--line);background:rgba(11,11,13,.92);backdrop-filter:blur(12px)}
.roomTop .r1{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.roomTop .r1 .c1{flex:1}.roomTop .r1 b{font-size:16px}.roomTop .r1 small{display:block;font-size:11px;color:var(--yes)}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.dateChip{align-self:center;font-size:11px;color:var(--sub);background:var(--card);padding:4px 12px;border-radius:99px}
.sys{align-self:center;max-width:90%;text-align:center;font-size:11px;color:var(--sub);padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
.sys.alert{color:#ffc2df;background:rgba(255,46,147,.12);border:1px solid rgba(255,46,147,.4)}
.m{display:flex;gap:8px;align-items:flex-end;max-width:84%}
.m.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:10px 13px;border-radius:18px;font-size:14px;background:var(--card2);border:1px solid var(--line);word-break:break-all}
.m.me .bub{background:var(--grad);border:0;color:#fff;border-bottom-right-radius:6px}
.m.them .bub{border-bottom-left-radius:6px}
.tm{font-size:10px;color:var(--sub);flex:none}
.cardMsg{width:250px;border-radius:18px;overflow:hidden;background:var(--card);border:1px solid rgba(255,46,147,.5);box-shadow:var(--glow)}
.cardMsg .ch{padding:10px 14px;background:var(--grad);font-size:13px;font-weight:800;color:#fff}
.cardMsg .cb{padding:10px 14px;font-size:13px}
.cardMsg .cb .cl{font-size:13px;padding:6px 0}
.cardMsg .note{font-size:12px;color:var(--sub);margin-top:6px}
.cardMsg .st{margin-top:8px;font-size:12px;font-weight:700;color:var(--maybe)}
.cardMsg .st.ok{color:var(--yes)}
.localHint{font-size:10px;color:var(--sub);text-align:center;padding:6px 16px 0;letter-spacing:0}
.quick{display:flex;gap:6px;padding:8px 12px 0;overflow-x:auto}
.quick::-webkit-scrollbar{display:none}
.qb{flex:none;font-size:12px;padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-weight:700}
.qb.sw{border-color:var(--no);color:#ff8a95;background:rgba(255,77,94,.08)}
.qb.pk{border-color:var(--pink);color:var(--pink2)}
.composer{display:flex;gap:8px;padding:8px 14px 16px;align-items:center}
.composer .txt{border-radius:999px;padding:12px 16px}
.send{width:44px;height:44px;border-radius:50%;flex:none;background:var(--grad);box-shadow:var(--glow);display:grid;place-items:center;font-size:18px}

/* 하단 탭 */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:30;display:flex;padding:8px 6px 14px;background:rgba(11,11,13,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tabbar a{flex:1;text-align:center;font-size:11px;color:var(--dim);padding:8px 0 4px;position:relative;min-height:52px}
.tabbar a svg{display:block;margin:0 auto 3px;width:24px;height:24px}
.tabbar a.on{color:var(--pink)}
.tabbar a.on svg{filter:drop-shadow(0 0 6px rgba(255,46,147,.7))}
.tabbar .nb{position:absolute;top:0;left:56%;min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;line-height:16px;padding:0 4px}

/* 모달 / 시트 */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);padding:24px;animation:fade .25s}
.modal.sheetWrap{align-items:flex-end;padding:0}
.mBox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;text-align:center}
.sheet{width:100%;max-width:430px;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px 26px;border-top:1px solid var(--line);text-align:left;animation:up .25s}
.sheet h3{font-size:17px;margin-bottom:12px}
.sheet label{display:block;font-size:12px;color:var(--sub);margin:10px 0 6px}
.matchPop h2{font-size:34px;font-weight:900;font-style:italic;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.matchPop .pair{display:flex;justify-content:center;margin:20px 0}
.matchPop .pair .av{width:96px;height:96px;border:3px solid var(--pink)}
.matchPop .pair .av .ini{font-size:36px}
.matchPop .pair .av+.av{margin-left:-18px}
.matchPop p{color:var(--sub);font-size:13px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:60;background:#222228;border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;animation:fade .2s;white-space:nowrap}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--grad)}.toggle.on::after{left:21px}
.setRow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.setRow:last-child{border:0}.setRow span{color:var(--sub);font-size:13px}
.meHead{display:flex;gap:16px;align-items:center;padding:20px 16px 6px}
.meHead .av{width:84px;height:84px}.meHead .av .ini{font-size:32px}
.meHead h2{font-size:22px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* 화면 전환 */
.screen,.room,.splash,.ob{animation:screenIn .28s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.modal .mBox{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.bell{position:relative}
.bell .nb{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--pink);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px;box-shadow:var(--glow)}
.notifRow{border-bottom:1px solid var(--line)}
.notifRow.unread{background:rgba(255,46,147,.06)}
.nIcon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.radar{position:relative;width:300px;height:300px;margin:20px auto;border-radius:50%;background:radial-gradient(circle,rgba(255,46,147,.12),rgba(11,11,13,1) 70%);border:1px solid rgba(255,46,147,.4);overflow:hidden}
.radar .sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,46,147,.45),transparent 25%);animation:spin 3s linear infinite}
.radar.scan .sweep{animation-duration:.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.ringR{position:absolute;border:1px solid rgba(255,46,147,.2);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}
.ringR.r1{width:33%;height:33%}.ringR.r2{width:66%;height:66%}.ringR.r3{width:99%;height:99%}
.dotB{position:absolute;width:4px;height:4px;border-radius:50%;background:rgba(255,95,176,.55)}
.blip{position:absolute;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--pink);box-shadow:0 0 12px var(--pink);animation:blink 2s infinite;z-index:2}
.blip.gold{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.blip span{position:absolute;left:14px;top:-3px;font-size:10px;white-space:nowrap;color:#fff}
@keyframes blink{50%{opacity:.4}}
.meDot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}
.rank{width:22px;font-size:18px;color:var(--pink);font-style:italic;text-align:center}
.fTag{cursor:pointer}
/* 즉각 반응 피드백 */
button,a,.card{touch-action:manipulation}
button:active,a:active,.act:active,.qb:active,.chip:active{transform:scale(.94);transition:transform .06s}
.btn:active{filter:brightness(1.15)}
.screen,.room,.splash,.ob{animation-duration:.18s}

  /* ---------- 안전한 저장소 ---------- */
  var KEY = "rare_dbm_state_v2";

  }

  }
  function save() { try { sSet(KEY, JSON.stringify(S)); } catch (e) {} }

      '<div class="tags" style="margin:6px 0"><span class="lock">🔒 탑 · 돔 고정</span></div><div class="tags"><span class="tag role">' + esc(me.roleTitle) + '</span><span class="tag">' + esc(me.gender) + '</span><span class="tag">' + me.height + "cm</span></div></div></div>" +
      '<div class="box"><h4>소개</h4><p>' + esc(me.bio) + '</p><p style="font-size:12px;color:var(--sub);margin-top:6px">' + esc(me.look) + '</p><div class="tags" style="margin-top:10px">' + (me.tags || []).map(function (x) { return '<span class="tag">' + esc(x) + "</span>"; }).join("") + "</div></div>" +
      '<div class="box"><h4>내 세이프워드</h4><div class="sw"><span style="font-size:12px;color:var(--sub)">상대에게도 공개돼요</span><b>' + esc(me.safeword) + '</b></div><button class="btn ghost" style="margin-top:10px;padding:11px;font-size:14px" data-act="editSafeword">세이프워드 바꾸기</button></div>' +
      '<div class="box"><h4>설정</h4>' + tg.map(function (x) { return '<button class="setRow" data-act="toggle" data-k="' + x[0] + '">' + esc(x[1]) + '<span class="toggle ' + (t[x[0]] ? "on" : "") + '"></span></button>'; }).join("") +
      '<button class="setRow" data-act="editStyle">호칭 / 성별 다시 고르기<span>' + esc(me.roleTitle) + " · " + esc(me.gender) + '</span></button><button class="setRow" data-act="resetAll" style="color:#ff8a95">데모 데이터 초기화<span>›</span></button></div>' +
      '<div class="policy">' + esc(DATA.policy.consent) + "</div>" +
      '<p class="fine" style="text-align:center;padding-bottom:20px">' + esc(DATA.app.name) + " · " + esc(todayLabel()) + "</p></section>" + tabbar("me");
  }

  /* ---------- 렌더 ---------- */
  var history2 = [];
  var modalHTML = "";
  function render() {
    var path = curPath() || "/discover";
    if (!S.ageOk) path = "/gate";
    else if (!S.onboarded && path !== "/onboard") path = "/onboard";
    else if (path === "/gate") path = "/discover";
    route = path;
    if (history2[history2.length - 1] !== path) history2.push(path);
    var parts = path.split("/"); var html;
    switch (parts[1]) {
      case "gate": html = vGate(); break;
      case "onboard": html = vOnboard(); break;
      case "profile": html = vProfile(parts[2]); break;
      case "matches": html = vMatches(); break;
      case "chats": html = vChats(); break;
      case "chat": html = vChat(parts[2]); break;
      case "me": html = vMe(); break;
      default: html = vDiscover();
    }
    var app = document.getElementById("app");
    app.innerHTML = html + (modalHTML || "");
    if (parts[1] === "chat") { var ms = document.getElementById("msgs"); if (ms) ms.scrollTop = ms.scrollHeight; }
    if (parts[1] === "discover") bindSwipe();
  }

  function openModal(h) { modalHTML = h; render(); }
  function closeModal() { modalHTML = ""; render(); }
  var toastT = 0;
  function toast(t) {
    var old = document.querySelector(".toast"); if (old) old.remove();
    var d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d);
    clearTimeout(toastT); toastT = setTimeout(function () { if (d.parentNode) d.remove(); }, 1800);
  }

  /* ---------- 탐색 동작 ---------- */
  function doLike(id) {
    var p = P(id); if (!p) return;
    if (S.seen.indexOf(id) < 0) S.seen.push(id);
    var wasMatched = S.profiles[id].matched;
    S.profiles[id].matched = true;
    if (!S.chats[id]) S.chats[id] = [];
    save();
    openModal('<div class="modal" id="matchModal"><div class="mBox matchPop"><h2>' + (wasMatched ? "Still Yours" : "It's a Match!") + "</h2><p>" + esc(p.nickname) + (wasMatched ? "님은 이미 당신과 매치된 상태예요." : "님도 당신을 기다리고 있었어요. (바텀 매칭률 100%)") + "</p>" +
      '<div class="pair"><div class="av">' + ph(S.me.image, S.me.nickname, "me") + '</div><div class="av">' + ph(p.image, p.nickname, p.id) + "</div></div>" +
      '<button class="btn" id="goChatBtn" data-act="goChat" data-id="' + id + '">메시지 보내기</button><button class="btn ghost" data-act="close">계속 둘러보기</button></div></div>');
  }
  function doPass(id) { if (S.seen.indexOf(id) < 0) S.seen.push(id); tickI++; save(); render(); }
  function flyOut(dir, cb) {
    var c = document.querySelector(".card.topCard");
    if (!c) return cb();
    c.style.transition = "transform .18s ease, opacity .18s";
    c.style.transform = "translateX(" + (dir * 520) + "px) rotate(" + (dir * 20) + "deg)"; c.style.opacity = "0";
    setTimeout(cb, 160);
  }
  var dragged = false;
  function bindSwipe() {
    var c = document.querySelector(".card.topCard"); if (!c) return;
    var sx = 0, sy = 0, dx = 0, down = false, likeS = c.querySelector(".stamp.like"), nopeS = c.querySelector(".stamp.nope");
    c.addEventListener("pointerdown", function (e) { down = true; dragged = false; sx = e.clientX; sy = e.clientY; dx = 0; c.style.transition = "none"; try { c.setPointerCapture(e.pointerId); } catch (er) {} });
    c.addEventListener("pointermove", function (e) {
      if (!down) return; dx = e.clientX - sx; if (Math.abs(dx) > 8 || Math.abs(e.clientY - sy) > 8) dragged = true;
      c.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 18) + "deg)";
      likeS.style.opacity = Math.max(0, Math.min(1, dx / 100)); nopeS.style.opacity = Math.max(0, Math.min(1, -dx / 100));
    });
    function up() {
      if (!down) return; down = false; var id = c.getAttribute("data-id");
      if (dx > 100) flyOut(1, function () { doLike(id); });
      else if (dx < -100) flyOut(-1, function () { doPass(id); });
      else { c.style.transition = ""; c.style.transform = ""; likeS.style.opacity = 0; nopeS.style.opacity = 0; }
    }
    c.addEventListener("pointerup", up); c.addEventListener("pointercancel", up);
  }

  /* ---------- 채팅 동작 ---------- */
  function chatId() { var p = route.split("/"); return p[1] === "chat" ? p[2] : null; }
  function push(id, m) { S.chats[id] = S.chats[id] || []; S.chats[id].push(m); save(); }
  function sendText() {
    var id = chatId(); var inp = document.getElementById("msgInput"); if (!id || !inp) return;
    var t = inp.value.trim(); if (!t) { inp.focus(); return; }
    push(id, { from: "me", text: t, time: now() }); render();
    var ni = document.getElementById("msgInput"); if (ni) ni.focus();
  }

  /* ---------- 클릭 처리 (위임) ---------- */
  var actions = {
    gateCheck: function () { gateChecked = !gateChecked; render(); },
    enter: function () { if (!gateChecked) { toast("만 21세 이상 확인에 체크해 주세요"); return; } S.ageOk = true; save(); nav(S.onboarded ? "/discover" : "/onboard", true); },
    obGender: function (el) { ob.gender = el.getAttribute("data-v"); render(); },
    obRole: function (el) { ob.role = el.getAttribute("data-v"); render(); if (ob.role === "custom") { var c = document.getElementById("customRole"); if (c) c.focus(); } },
    obDone: function () {
      var c = document.getElementById("customRole"); if (c) ob.custom = c.value;
      if (ob.role === "custom" && !ob.custom.trim()) { toast("호칭을 입력해 주세요"); return; }
      var r = DATA.onboarding.roles.filter(function (x) { return x.id === ob.role; })[0];
      S.me.gender = ob.gender; S.me.roleTitle = ob.role === "custom" ? ob.custom.trim() : r.label; S.onboarded = true; save(); ob = null;
      toast(S.me.roleTitle + " 등록 완료. 바텀들이 술렁이고 있어요"); nav("/discover", true);
    },
    like: function () { var l = deckList(); if (l[0]) flyOut(1, function () { doLike(l[0].id); }); },
    pass: function () { var l = deckList(); if (l[0]) flyOut(-1, function () { doPass(l[0].id); }); },
    openTop: function () { var l = deckList(); if (l[0]) nav("/profile/" + l[0].id); },
    openCard: function (el) { if (dragged) { dragged = false; return; } nav("/profile/" + el.getAttribute("data-id")); },
    likeId: function (el) { doLike(el.getAttribute("data-id")); },
    passId: function (el) { doPass(el.getAttribute("data-id")); nav("/discover"); },
    goChat: function (el) { modalHTML = ""; nav("/chat/" + el.getAttribute("data-id")); },
    close: closeModal,
    closeBg: function (el, e) { if (e.target === el) closeModal(); },
    back: function () { var prev = history2[history2.length - 2] || "/discover"; history2.length = Math.max(0, history2.length - 2); nav(prev); },
    lockInfo: function () { toast("탑 · 돔 포지션은 고정이에요. 호칭은 MY에서 바꿀 수 있어요"); },
    toastMsg: function (el) { toast(el.getAttribute("data-msg")); },
    resetDeck: function () { S.seen = []; save(); render(); },
    send: sendText,
    toggle: function (el) { var k = el.getAttribute("data-k"); S.toggles[k] = !S.toggles[k]; save(); render(); },
    editStyle: function () { ob = null; S.onboarded = false; save(); nav("/onboard"); },
    editSafeword: function () {
      openModal('<div class="modal sheetWrap" data-act="closeBg"><div class="sheet"><h3>세이프워드 바꾸기</h3><input class="txt" id="swInput" maxlength="12" value="' + esc(S.me.safeword) + '"><button class="btn" data-act="swSave">저장</button><button class="btn ghost" data-act="close">취소</button></div></div>');
    },
    swSave: function () { var e = document.getElementById("swInput"); if (e && e.value.trim()) S.me.safeword = e.value.trim(); save(); closeModal(); toast("세이프워드를 저장했어요"); },
    resetAll: function () { sDel(KEY); load(); gateChecked = false; ob = null; modalHTML = ""; nav("/gate", true); }
  };

  document.addEventListener("click", function (e) {
    var el = e.target.closest ? e.target.closest("[data-act]") : null;
    if (el && actions[el.getAttribute("data-act")]) {
      if (el.getAttribute("data-act") !== "closeBg" || e.target === el) { e.preventDefault(); actions[el.getAttribute("data-act")](el, e); return; }
    }
    var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
    if (a) { e.preventDefault(); modalHTML = ""; nav(a.getAttribute("href")); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
    if (e.target.id === "msgInput") { e.preventDefault(); sendText(); }
    else if (e.target.id === "customRole") { e.preventDefault(); actions.obDone(); }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "customRole" && ob) {
      ob.custom = e.target.value;
      var b = document.getElementById("obDone"); if (b) b.classList.toggle("off", !ob.custom.trim());
    }
  });
  document.addEventListener("submit", function (e) { e.preventDefault(); });

  setInterval(function () { if (route === "/discover" && !modalHTML) { tickI++; var t = document.getElementById("tick"); if (t) t.innerHTML = "<em>LIVE</em>" + esc(DATA.app.tickers[tickI % DATA.app.tickers.length]); } }, 4500);

  function start() { load(); route = curPath() || "/discover"; render(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>
</body>
</html>
