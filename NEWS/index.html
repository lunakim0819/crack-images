<!DOCTYPE html>
<html lang="ko">
<head>

  <title>졸업식 날 부친 숨지게 한 고3 아들 자수…"동생은 몰랐다" | 콩뉴스</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #c41230;
      --red-dark: #9e0e26;
      --text: #111;
      --text-2: #333;
      --muted: #767676;
      --line: #e6e6e6;
      --bg: #fff;
      --bg-soft: #f7f7f7;
      --bg-top: #f3f3f3;
      --chip: #f2f2f2;
      --article-size: 18px;
      --max: 1080px;
      --article-max: 720px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); }
    body {
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    button, input, textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    button { background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    .inner { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 16px; }

    /* top utility */
    .util {
      background: var(--bg-top);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }
    .util .inner { display: flex; align-items: center; justify-content: space-between; height: 34px; }
    .util-links { display: flex; gap: 12px; }
    .util-links a:hover { color: var(--text); }

    /* header */
    .header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 56px;
    }
    .logo { display: flex; align-items: center; gap: 7px; }
    .logo-mark {
      width: 28px; height: 28px;
      background: var(--red);
      color: #fff;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: -0.06em;
      line-height: 1;
    }
    .logo-text { font-weight: 900; font-size: 22px; letter-spacing: -0.06em; }
    .header-actions { display: flex; align-items: center; gap: 2px; }
    .icon-btn {
      width: 40px; height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #222;
      border-radius: 8px;
    }
    .icon-btn:hover { background: var(--bg-soft); }
    .icon-btn svg { width: 22px; height: 22px; }

    .nav {
      display: flex;
      gap: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      border-top: 1px solid #f0f0f0;
    }
    .nav::-webkit-scrollbar { display: none; }
    .nav a {
      flex: 0 0 auto;
      padding: 11px 12px 10px;
      font-size: 15px;
      font-weight: 500;
      color: #333;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .nav a.active {
      color: var(--red);
      font-weight: 700;
      border-bottom-color: var(--red);
    }


    .nav-wrap { position: relative; }
    .nav-wrap::after {
      content: "";
      position: absolute;
      right: 0; top: 0; bottom: 2px;
      width: 28px;
      background: linear-gradient(to right, rgba(255,255,255,0), #fff 80%);
      pointer-events: none;
    }

    /* search panel */
    .search-panel {
      display: none;
      border-top: 1px solid var(--line);
      background: #fff;
      padding: 12px 0 16px;
    }
    .search-panel.open { display: block; }
    .search-form { display: flex; gap: 8px; }
    .search-form input {
      flex: 1;
      height: 42px;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 0 12px;
      outline: none;
    }
    .search-form input:focus { border-color: var(--red); }
    .search-form button[type="submit"] {
      height: 42px;
      padding: 0 16px;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      border-radius: 4px;
    }
    .search-msg { margin-top: 8px; font-size: 13px; color: var(--muted); }

    /* ticker */
    .ticker {
      background: var(--red);
      color: #fff;
      height: 36px;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }
    .ticker-label {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      padding: 0 10px 0 16px;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.04em;
      background: var(--red-dark);
    }
    .ticker-viewport { flex: 1; overflow: hidden; position: relative; }
    .ticker-track {
      display: inline-flex;
      align-items: center;
      height: 36px;
      white-space: nowrap;
      animation: ticker 28s linear infinite;
    }
    .ticker-item {
      padding: 0 28px 0 12px;
      font-size: 13px;
      font-weight: 500;
    }
    @keyframes ticker {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ticker-track { animation: none; }
    }

    /* layout */
    .page { padding: 16px 0 48px; }
    .layout {
      width: 100%;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 40px;
    }
    .article-col { min-width: 0; max-width: var(--article-max); }

    .breadcrumb { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb .sep { margin: 0 6px; color: #bbb; }

    .headline {
      font-size: 24px;
      font-weight: 900;
      line-height: 1.38;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
    }
    .subheads { list-style: none; margin: 0 0 18px; }
    .subheads li {
      position: relative;
      padding-left: 12px;
      font-size: 15px;
      line-height: 1.7;
      color: var(--text-2);
    }
    .subheads li::before {
      content: "-";
      position: absolute;
      left: 0;
      color: #111;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 20px;
    }
    .meta-info { font-size: 13px; color: var(--muted); line-height: 1.7; }
    .meta-info .reporter { color: #111; font-weight: 700; }
    .meta-info .email { color: #555; }
    .tools { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .tool {
      min-width: 34px;
      height: 32px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e1e1e1;
      border-radius: 4px;
      color: #444;
      font-size: 12px;
      font-weight: 700;
      background: #fff;
    }
    .tool + .tool { margin-left: 2px; }
    .tool:hover { background: var(--bg-soft); }
    .tool.active, .tool[aria-pressed="true"] { border-color: var(--red); color: var(--red); }
    .tool svg { width: 16px; height: 16px; }
    .font-group { display: inline-flex; margin-right: 4px; }
    .font-group .tool { border-radius: 0; }
    .font-group .tool:first-child { border-radius: 4px 0 0 4px; }
    .font-group .tool:last-child { border-radius: 0 4px 4px 0; margin-left: -1px; }
    .font-group .tool:not(:first-child) { margin-left: -1px; }

    .figure { margin: 0 0 22px; }
    .figure-frame {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #d8d8d8;
      color: #777;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      overflow: hidden;
    }
    .figure-frame img { width: 100%; height: 100%; object-fit: cover; }
    .figure-ph-icon { font-size: 28px; opacity: 0.7; }
    .figure-ph-text { font-size: 13px; }
    .caption { margin-top: 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }

    .body { font-size: var(--article-size); line-height: 1.9; color: #222; }
    .body p { margin: 0 0 1.15em; }
    .body .byline-end { margin-top: 1.6em; font-size: 0.95em; color: #444; }
    .copyright {
      margin: 8px 0 0;
      font-size: 13px;
      color: #555;
      font-weight: 500;
    }
    .tip-line { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

    .keywords { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 8px; }
    .keywords a, .keywords span {
      display: inline-block;
      padding: 6px 10px;
      background: var(--chip);
      border-radius: 20px;
      font-size: 13px;
      color: #333;
    }
    .keywords a:hover { background: #e9e9e9; }

    /* reactions */
    .react {
      margin: 28px 0 0;
      padding: 20px 12px 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .react-title {
      text-align: center;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    .react-list {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
    }
    .react-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 2px;
      border-radius: 8px;
      color: #333;
    }
    .react-btn:hover { background: var(--bg-soft); }
    .react-btn.selected { background: #fff3f4; }
    .react-emoji {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: #f4f4f4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      line-height: 1;
    }
    .react-btn.selected .react-emoji {
      background: #ffe3e6;
      box-shadow: 0 0 0 2px var(--red);
    }
    .react-label { font-size: 11px; font-weight: 500; text-align: center; line-height: 1.3; }
    .react-count { font-size: 13px; font-weight: 800; color: #111; }
    .react-btn.selected .react-count { color: var(--red); }

    /* comments */
    .comments { margin-top: 36px; }
    .comments-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      border-bottom: 2px solid #111;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .comments-head h2 { font-size: 18px; font-weight: 900; }
    .comments-head .count { color: var(--red); font-weight: 800; font-size: 18px; }
    .sort-tabs { display: flex; gap: 14px; margin-bottom: 14px; }
    .sort-tabs button {
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
    }
    .sort-tabs button.active { color: #111; font-weight: 800; border-bottom-color: #111; }

    .c-form {
      background: var(--bg-soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }
    .c-form input[type="text"] {
      width: 100%;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0 10px;
      background: #fff;
      margin-bottom: 8px;
      outline: none;
    }
    .c-form input:focus, .c-form textarea:focus { border-color: #999; }
    .c-form textarea {
      width: 100%;
      min-height: 84px;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      background: #fff;
      resize: vertical;
      outline: none;
      line-height: 1.5;
    }
    .c-form-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
    }
    .c-count { font-size: 12px; color: var(--muted); }
    .c-submit {
      height: 34px;
      padding: 0 16px;
      background: var(--red);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      border-radius: 4px;
    }
    .c-submit:disabled { opacity: 0.45; cursor: default; }

    .c-item { padding: 14px 0; border-bottom: 1px solid var(--line); }
    .c-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .c-nick { font-size: 13px; font-weight: 700; }
    .c-time { font-size: 12px; color: var(--muted); }
    .c-text { font-size: 15px; line-height: 1.65; color: #222; }
    .c-acts { display: flex; gap: 8px; margin-top: 8px; }
    .c-vote {
      height: 28px;
      padding: 0 8px;
      border: 1px solid #e1e1e1;
      border-radius: 14px;
      font-size: 12px;
      color: #555;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fff;
    }
    .c-vote.on { border-color: var(--red); color: var(--red); font-weight: 700; background: #fff7f8; }

    /* related */
    .related { margin-top: 40px; }
    .section-title {
      font-size: 18px;
      font-weight: 900;
      padding-bottom: 10px;
      border-bottom: 2px solid #111;
      margin-bottom: 4px;
    }
    .rel-item, .pop-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      align-items: flex-start;
    }
    .rel-date {
      flex: 0 0 86px;
      font-size: 12px;
      color: var(--muted);
      padding-top: 2px;
    }
    .rel-title { font-size: 15px; font-weight: 500; line-height: 1.5; }
    .rel-item:hover .rel-title, .pop-item:hover .pop-title { text-decoration: underline; }

    .popular { margin-top: 8px; }
    .pop-rank {
      flex: 0 0 22px;
      font-size: 16px;
      font-weight: 900;
      color: #111;
      line-height: 1.4;
    }
    .pop-item:nth-child(-n+3) .pop-rank { color: var(--red); }
    .pop-title { font-size: 15px; line-height: 1.5; flex: 1; }
    .pop-current .pop-title { font-weight: 700; }

    /* footer */
    .footer {
      background: #1b1b1b;
      color: #bdbdbd;
      font-size: 12px;
      line-height: 1.7;
      padding: 28px 0 40px;
    }
    .footer strong { color: #fff; font-size: 14px; }
    .footer a:hover { color: #fff; text-decoration: underline; }
    .footer-logo { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; color: #fff; }
    .footer-logo .logo-mark { width: 22px; height: 22px; font-size: 12px; }
    .footer-logo .logo-text { font-size: 16px; }
    .footer p { margin: 0; }
    .footer .copy { margin-top: 14px; color: #888; }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(12px);
      background: rgba(20,20,20,0.92);
      color: #fff;
      font-size: 13px;
      padding: 10px 16px;
      border-radius: 6px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 80;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (min-width: 900px) {
      .headline { font-size: 32px; }
      .header-row { height: 64px; }
      .logo-text { font-size: 26px; }
      .logo-mark { width: 32px; height: 32px; font-size: 17px; }
      .nav a { padding: 12px 16px 11px; font-size: 16px; }
      .layout { grid-template-columns: minmax(0, 1fr) 300px; align-items: start; padding-top: 8px; }
      .article-col { max-width: none; }
      .sidebar { position: sticky; top: 86px; padding-top: 22px; }
      .popular { margin-top: 0; }
    }


    .c-badge {
      display: inline-block;
      margin-left: 4px;
      padding: 0 5px;
      height: 18px;
      line-height: 18px;
      border-radius: 3px;
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      vertical-align: middle;
    }
    .c-replies {
      margin: 10px 0 0 12px;
      padding: 0 0 0 12px;
      border-left: 2px solid #ececec;
    }
    .c-reply {
      padding: 10px 0;
      border-bottom: 1px solid #f3f3f3;
    }
    .c-reply:last-child { border-bottom: 0; padding-bottom: 2px; }
    .c-reply .c-text { font-size: 14px; }
    .rel-item.rel-current .rel-title { font-weight: 700; }
    .figure-frame.has-img {
      aspect-ratio: 1056 / 752;
      background: #111;
    }
    .figure-frame.has-img img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }


    @media print {
      .util, .header, .ticker, .tools, .react, .comments, .related, .sidebar, .footer, .toast, .search-panel { display: none !important; }
      .layout { display: block; padding: 0; }
      body { color: #000; }
    }
  </style>
</head>

  <script>
  /* ============================================================
   * 콩뉴스 기사 데이터 (v2)

        '<p class="c-text">' + escapeHtml(c.text) + "</p>" +
        '<div class="c-acts">' +
          '<button type="button" class="c-vote' + (c.vote === "like" ? " on" : "") + '" data-action="c-like" data-id="' + escapeHtml(c.id) + '" aria-pressed="' + (c.vote === "like") + '">공감 ' + formatCount(c.like) + "</button>" +
          '<button type="button" class="c-vote' + (c.vote === "dislike" ? " on" : "") + '" data-action="c-dislike" data-id="' + escapeHtml(c.id) + '" aria-pressed="' + (c.vote === "dislike") + '">비공감 ' + formatCount(c.dislike) + "</button>" +
        "</div>" +
        (replies ? '<div class="c-replies">' + replies + "</div>" : "") +
      "</article>"
    );
  }

  function render() {
    const d = DATA;
    const art = currentArticle();
    const fontPx = FONT_STEPS[state.fontIndex];
    document.title = art.headline + " | " + d.outlet.name;
    document.documentElement.style.setProperty("--article-size", fontPx + "px");

    const navHtml = d.outlet.sections.map(function (sec) {
      const active = sec === d.outlet.activeSection ? " active" : "";
      return '<a href="#" data-action="nav"' + (active ? ' class="active" aria-current="page"' : "") + ">" + escapeHtml(sec) + "</a>";
    }).join("");

    const tickerItems = art.ticker.map(function (t) {
      return '<span class="ticker-item">' + escapeHtml(t) + "</span>";
    }).join("");

    const subheads = art.subheads.map(function (s) {
      return "<li>" + escapeHtml(s) + "</li>";
    }).join("");

    const imgSrc = (art.image && art.image.src) ? String(art.image.src).trim() : "";
    const figureInner = imgSrc
      ? '<img src="' + escapeHtml(imgSrc) + '" alt="' + escapeHtml(art.image.alt || "") + '">'
      : ('<div class="figure-ph-icon" aria-hidden="true"><svg viewBox="0 0 48 48" width="40" height="40" fill="none" stroke="#8a8a8a" stroke-width="2"><rect x="6" y="12" width="36" height="26" rx="3"/><circle cx="24" cy="25" r="7"/><path d="M16 12l3-6h10l3 6"/></svg></div><div class="figure-ph-text">자료사진</div>');

    const paragraphs = art.paragraphs.map(function (p) {
      return "<p>" + escapeHtml(p) + "</p>";
    }).join("");

    const keywords = art.keywords.map(function (k) {
      return '<a href="#">' + escapeHtml("#" + k) + "</a>";
    }).join("");

    const reactBtns = art.reactions.map(function (r) {
      const selected = state.reaction === r.id;
      return (
        '<button type="button" class="react-btn' + (selected ? " selected" : "") + '" data-action="react" data-id="' + escapeHtml(r.id) + '" aria-pressed="' + selected + '">' +
          '<span class="react-emoji">' + escapeHtml(r.emoji) + "</span>" +
          '<span class="react-label">' + escapeHtml(r.label) + "</span>" +
          '<span class="react-count">' + formatCount(reactionCount(r)) + "</span>" +
        "</button>"
      );
    }).join("");

    const comments = sortedComments();
    const best = bestIdSet(comments);
    const commentItems = comments.map(function (c) {
      return renderComment(c, !!best[c.id], false);
    }).join("");
    const commentCount = comments.reduce(function (n, c) { return n + 1 + (c.replies ? c.replies.length : 0); }, 0);

    const related = d.related.map(function (item) {
      const current = item.id === state.articleId;
      return (
        '<a class="rel-item' + (current ? " rel-current" : "") + '" href="#' + escapeHtml(item.id) + '" data-action="open-article" data-id="' + escapeHtml(item.id) + '">' +
          '<span class="rel-date">' + escapeHtml(item.date) + "</span>" +
          '<span class="rel-title">' + escapeHtml(item.title) + "</span>" +
        "</a>"
      );
    }).join("");

    const popular = art.popular.map(function (item, i) {
      const current = item.id && item.id === state.articleId;
      const href = item.id ? ("#" + item.id) : "#";
      const action = item.id
        ? ' data-action="open-article" data-id="' + escapeHtml(item.id) + '"'
        : ' data-action="nav"';
      return (
        '<a class="pop-item' + (current ? " pop-current" : "") + '" href="' + escapeHtml(href) + '"' + action + ">" +
          '<span class="pop-rank">' + (i + 1) + "</span>" +
          '<span class="pop-title">' + escapeHtml(item.title) + "</span>" +
        "</a>"
      );
    }).join("");

    const f = d.outlet.footer;
    const searchOpen = state.searchOpen ? " open" : "";

    document.getElementById("app").innerHTML =
      '<div class="util"><div class="inner">' +
        "<span>" + escapeHtml(art.headerDate) + "</span>" +
        '<div class="util-links"><a href="#">구독</a><a href="#">로그인</a></div>' +
      "</div></div>" +
      '<header class="header"><div class="inner">' +
        '<div class="header-row">' +
          '<a class="logo" href="#' + escapeHtml(DATA.defaultArticleId) + '" data-action="open-article" data-id="' + escapeHtml(DATA.defaultArticleId) + '" aria-label="' + escapeHtml(d.outlet.name) + ' 홈">' +
            '<span class="logo-mark">콩</span><span class="logo-text">뉴스</span>' +
          "</a>" +
          '<div class="header-actions">' +
            '<button type="button" class="icon-btn" data-action="search" aria-expanded="' + state.searchOpen + '" aria-label="검색">' + iconSearch() + "</button>" +
          "</div>" +
        "</div>" +
        '<div class="nav-wrap"><nav class="nav" aria-label="섹션">' + navHtml + "</nav></div>" +
        '<div class="search-panel' + searchOpen + '" id="search-panel">' +
          '<form class="search-form" data-action="search-submit">' +
            '<label class="sr-only" for="q">검색어</label>' +
            '<input id="q" name="q" type="search" placeholder="검색어를 입력해 주세요" autocomplete="off">' +
            '<button type="submit">검색</button>' +
          "</form>" +
          (state.searchMsg ? '<p class="search-msg">' + escapeHtml(state.searchMsg) + "</p>" : "") +
        "</div>" +
      "</div></header>" +
      '<div class="ticker" role="marquee" aria-label="속보">' +
        '<div class="inner" style="display:flex;align-items:stretch;padding:0;max-width:none;">' +
          '<span class="ticker-label">속보</span>' +
          '<div class="ticker-viewport"><div class="ticker-track">' + tickerItems + tickerItems + "</div></div>" +
        "</div>" +
      "</div>" +
      '<main class="page"><div class="layout">' +
        '<article class="article-col">' +
          '<nav class="breadcrumb" aria-label="본문 위치">' +
            '<a href="#">' + escapeHtml(art.breadcrumb[0]) + "</a><span class=\"sep\">&gt;</span><span>" + escapeHtml(art.breadcrumb[1]) + "</span>" +
          "</nav>" +
          "<h1 class=\"headline\">" + escapeHtml(art.headline) + "</h1>" +
          "<ul class=\"subheads\">" + subheads + "</ul>" +
          '<div class="meta">' +
            '<div class="meta-info">' +
              "<div>송고 " + escapeHtml(art.published) + "  수정 " + escapeHtml(art.modified) + "</div>" +
              '<div><span class="reporter">' + escapeHtml(art.reporter) + '</span>  <a class="email" href="mailto:' + escapeHtml(art.email) + '">' + escapeHtml(art.email) + "</a></div>" +
            "</div>" +
            '<div class="tools">' +
              '<div class="font-group" role="group" aria-label="글자 크기">' +
                '<button type="button" class="tool" data-action="font-down" aria-label="글자 작게">가-</button>' +
                '<button type="button" class="tool' + (state.fontIndex === 1 ? " active" : "") + '" data-action="font-reset" aria-label="글자 기본">가</button>' +
                '<button type="button" class="tool" data-action="font-up" aria-label="글자 크게">가+</button>' +
              "</div>" +
              '<button type="button" class="tool" data-action="share" aria-label="공유">' + iconShare() + "</button>" +
              '<button type="button" class="tool" data-action="print" aria-label="인쇄">' + iconPrint() + "</button>" +
            "</div>" +
          "</div>" +
          '<figure class="figure">' +
            '<div class="figure-frame' + (imgSrc ? " has-img" : "") + '">' + figureInner + "</div>" +
            "<figcaption class=\"caption\">" + escapeHtml(art.image.caption) + "</figcaption>" +
          "</figure>" +
          '<div class="body">' + paragraphs +
            '<p class="byline-end">' + escapeHtml(art.reporter) + " (" + escapeHtml(art.email) + ")</p>" +
          "</div>" +
          '<p class="copyright">' + escapeHtml(art.copyright) + "</p>" +
          '<p class="tip-line">' + escapeHtml(art.tipLine) + "</p>" +
          '<div class="keywords">' + keywords + "</div>" +
          '<section class="react" aria-label="감정표현">' +
            '<h2 class="react-title">이 기사에 대한 내 반응</h2>' +
            '<div class="react-list">' + reactBtns + "</div>" +
          "</section>" +
          '<section class="comments" aria-label="댓글">' +
            '<div class="comments-head"><h2>댓글</h2><span class="count">' + formatCount(commentCount) + "</span></div>" +
            '<div class="sort-tabs" role="tablist">' +
              '<button type="button" class="' + (state.sort === "like" ? "active" : "") + '" data-action="sort" data-sort="like">순공감순</button>' +
              '<button type="button" class="' + (state.sort === "new" ? "active" : "") + '" data-action="sort" data-sort="new">최신순</button>' +
              '<button type="button" class="' + (state.sort === "ratio" ? "active" : "") + '" data-action="sort" data-sort="ratio">공감비율순</button>' +
            "</div>" +
            '<form class="c-form" data-action="comment-submit">' +
              '<label class="sr-only" for="nick">닉네임</label>' +
              '<input id="nick" name="nick" type="text" maxlength="20" placeholder="닉네임 (비우면 익명****)">' +
              '<label class="sr-only" for="cbody">댓글</label>' +
              '<textarea id="cbody" name="body" maxlength="500" placeholder="댓글을 입력해 주세요." required></textarea>' +
              '<div class="c-form-row"><span class="c-count" id="c-remain">0 / 500</span><button type="submit" class="c-submit">등록</button></div>' +
            "</form>" +
            '<div class="c-list">' + commentItems + "</div>" +
          "</section>" +
          '<section class="related">' +
            "<h2 class=\"section-title\">관련 기사</h2>" + related +
          "</section>" +
        "</article>" +
        '<aside class="sidebar">' +
          '<section class="popular">' +
            "<h2 class=\"section-title\">많이 본 뉴스</h2>" + popular +
          "</section>" +
        "</aside>" +
      "</div></main>" +
      '<footer class="footer"><div class="inner">' +
        '<div class="footer-logo"><span class="logo-mark">콩</span><span class="logo-text">뉴스</span></div>' +
        "<p><strong>" + escapeHtml(d.outlet.name) + "</strong></p>" +
        "<p>" + escapeHtml(f.address) + "</p>" +
        "<p>" + escapeHtml(f.registration) + "</p>" +
        "<p>" + escapeHtml(f.publisher) + " | " + escapeHtml(f.youth) + "</p>" +
        "<p>" + escapeHtml(f.tip) + "</p>" +
        "<p>편집국 " + escapeHtml(f.email) + "</p>" +
        '<p class="copy">' + escapeHtml(f.copyright) + "</p>" +
      "</div></footer>";
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }

  function setFont(index) {
    state.fontIndex = Math.max(0, Math.min(FONT_STEPS.length - 1, index));
    saveJson("kongnews.v2.font", state.fontIndex);
    render();
  }

  function bind() {
    const app = document.getElementById("app");
    app.addEventListener("click", function (e) {
      const btn = e.target.closest("[data-action]");
      if (!btn || btn.closest("form")) return;
      const action = btn.getAttribute("data-action");
      if (action === "search") {
        state.searchOpen = !state.searchOpen;
        if (!state.searchOpen) state.searchMsg = "";
        render();
        if (state.searchOpen) {
          const input = document.getElementById("q");
          if (input) input.focus();
        }
      } else if (action === "nav") {
        e.preventDefault();
      } else if (action === "open-article") {
        e.preventDefault();
        openArticle(btn.getAttribute("data-id"));
      } else if (action === "font-down") {
        setFont(state.fontIndex - 1);
      } else if (action === "font-up") {
        setFont(state.fontIndex + 1);
      } else if (action === "font-reset") {
        setFont(1);
      } else if (action === "print") {
        window.print();
      } else if (action === "share") {
        const url = location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(function () { toast("기사 주소를 복사했습니다."); }).catch(function () { toast(url); });
        } else {
          toast("이 페이지 주소를 복사해 공유해 주세요.");
        }
      } else if (action === "react") {
        const id = btn.getAttribute("data-id");
        state.reaction = (state.reaction === id) ? null : id;
        saveJson(articleKey("reaction"), state.reaction);
        render();
      } else if (action === "sort") {
        state.sort = btn.getAttribute("data-sort") || "like";
        render();
      } else if (action === "c-like" || action === "c-dislike") {
        const id = btn.getAttribute("data-id");
        const next = action === "c-like" ? "like" : "dislike";
        if (state.votes[id] === next) delete state.votes[id];
        else state.votes[id] = next;
        saveJson(articleKey("votes"), state.votes);
        render();
      }
    });

    app.addEventListener("submit", function (e) {
      const form = e.target;
      if (!(form instanceof HTMLFormElement)) return;
      const action = form.getAttribute("data-action");
      if (action === "search-submit") {
        e.preventDefault();
        const q = (form.q && form.q.value || "").trim();
        state.searchOpen = true;
        state.searchMsg = q ? "\"" + q + "\"에 대한 검색 결과는 이 데모 페이지에서 제공하지 않습니다." : "검색어를 입력해 주세요.";
        render();
        const input = document.getElementById("q");
        if (input) { input.value = q; input.focus(); }
      } else if (action === "comment-submit") {
        e.preventDefault();
        const nickRaw = (form.nick && form.nick.value || "").trim();
        const body = (form.body && form.body.value || "").trim();
        if (!body) { toast("댓글을 입력해 주세요."); return; }
        const now = new Date();
        const pad = function (n) { return String(n).padStart(2, "0"); };
        const time = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + " " + pad(now.getHours()) + ":" + pad(now.getMinutes());
        let nick = nickRaw || "익명****";
        if (nickRaw && nickRaw.indexOf("*") === -1 && nickRaw.length > 2) {
          nick = nickRaw.slice(0, 3) + "****";
        }
        state.extraComments.push({
          id: "u-" + Date.now(),
          nick: nick,
          time: time,
          text: body,
          like: 0,
          dislike: 0,
          isUser: true
        });
        saveJson(articleKey("comments"), state.extraComments);
        state.sort = "new";
        render();
        toast("댓글을 등록했습니다.");
      }
    });

    app.addEventListener("input", function (e) {
      if (e.target && e.target.id === "cbody") {
        const remain = document.getElementById("c-remain");
        if (remain) remain.textContent = e.target.value.length + " / 500";
      }
    });

    window.addEventListener("popstate", function () {
      const next = idFromHash();
      if (next === state.articleId) return;
      persistArticleState();
      state.articleId = next;
      state.searchOpen = false;
      state.searchMsg = "";
      loadArticleState();
      render();
      window.scrollTo(0, 0);
    });
  }

  function init() {
    loadFont();
    state.articleId = idFromHash();
    loadArticleState();
    if ((location.hash || "") !== "#" + state.articleId) {
      history.replaceState({ articleId: state.articleId }, "", "#" + state.articleId);
    }
    render();
    bind();
  }

  init();

  </script>
</body>
</html>
